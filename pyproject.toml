[project]
name = "jou"
version = "0.1.0"
description = "Transparent TTY wrapper with LLM-powered command assistance"
requires-python = ">=3.11"
dependencies = [
    "pyte>=0.8",
    "openai>=1.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
jou = "jou.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jou"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ty>=0.0.66",
]

[tool.ty.environment]
python-version = "3.11"
