[project]
name = "expecto"
version = "0.1.0"
description = "Transparent TTY wrapper with LLM-powered command assistance"
requires-python = ">=3.11"
dependencies = [
    "pyte>=0.8",
    "openai>=1.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
expecto = "expecto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expecto"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "ty>=0.0.66",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.environment]
python-version = "3.11"
